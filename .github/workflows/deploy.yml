name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ADMIN_APP_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_APP_URL }}
        run: npm run build

      - name: Package standalone
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -czf frontend-build.tar.gz -C .next/standalone .

      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: frontend-build.tar.gz
          target: /tmp/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/okaynow/frontend
            sudo tar -xzf /tmp/frontend-build.tar.gz -C /opt/okaynow/frontend
            sudo chown -R ubuntu:ubuntu /opt/okaynow/frontend
            rm -f /tmp/frontend-build.tar.gz
            sudo systemctl restart okaynow-frontend
            sleep 3
            sudo systemctl is-active --quiet okaynow-frontend
            echo "Frontend running"
